<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="800" height="600" fill="#0b3d24"/>
  <g stroke="#1e6b45" stroke-width="1" opacity="0.5">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- U1: large IC top-left -->
  <rect x="90" y="70" width="120" height="90" fill="#1c1c1c" stroke="#c9a227" stroke-width="2"/>
  <circle cx="105" cy="85" r="4" fill="#c9a227"/>
  <text x="150" y="120" fill="#eee" font-size="16" text-anchor="middle">U1</text>

  <!-- U2: IC mid-top -->
  <rect x="340" y="60" width="90" height="70" fill="#1c1c1c" stroke="#c9a227" stroke-width="2"/>
  <text x="385" y="100" fill="#eee" font-size="14" text-anchor="middle">U2</text>

  <!-- U3: IC top-right, target of demo defects -->
  <rect x="600" y="80" width="110" height="80" fill="#1c1c1c" stroke="#c9a227" stroke-width="2"/>
  <text x="655" y="125" fill="#eee" font-size="16" text-anchor="middle">U3</text>
  <!-- solder pads along U3's bottom edge -->
  <g fill="#d4d4d4">
    <rect x="610" y="158" width="10" height="14"/>
    <rect x="628" y="158" width="10" height="14"/>
    <rect x="646" y="158" width="10" height="14"/>
    <rect x="664" y="158" width="10" height="14"/>
    <rect x="682" y="158" width="10" height="14"/>
    <rect x="700" y="158" width="10" height="14"/>
  </g>

  <!-- C12: capacitor mid-board, referenced in demo note as "misaligned" -->
  <circle cx="420" cy="330" r="22" fill="#2b2b2b" stroke="#9ca3af" stroke-width="2"/>
  <text x="420" y="372" fill="#eee" font-size="13" text-anchor="middle">C12</text>

  <!-- a few more passive components scattered around -->
  <rect x="120" y="280" width="40" height="18" fill="#2b2b2b" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="140" y="315" fill="#9ca3af" font-size="11" text-anchor="middle">C1</text>

  <rect x="220" y="400" width="18" height="40" fill="#2b2b2b" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="229" y="458" fill="#9ca3af" font-size="11" text-anchor="middle">R4</text>

  <rect x="520" y="380" width="36" height="36" fill="#1c1c1c" stroke="#c9a227" stroke-width="2"/>
  <text x="538" y="435" fill="#9ca3af" font-size="11" text-anchor="middle">U4</text>

  <!-- edge connector -->
  <rect x="0" y="520" width="800" height="30" fill="#2b2b2b"/>
  <g fill="#d4d4d4">
    <rect x="20" y="520" width="8" height="30"/>
    <rect x="40" y="520" width="8" height="30"/>
    <rect x="60" y="520" width="8" height="30"/>
    <rect x="80" y="520" width="8" height="30"/>
    <rect x="100" y="520" width="8" height="30"/>
  </g>

  <!-- traces -->
  <g stroke="#c9a227" stroke-width="2" fill="none" opacity="0.7">
    <path d="M210 110 H340"/>
    <path d="M430 95 H600 V80"/>
    <path d="M655 160 V330 H442"/>
    <path d="M150 160 V280"/>
    <path d="M420 352 V400 H520"/>
  </g>
</svg>
